<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="600" fill="#161616"/>
  <rect x="0" y="0" width="280" height="600" fill="none" stroke="#2d2d2d" stroke-width="1"/>
  
  <!-- Logo area -->
  <rect x="85" y="28" width="110" height="110" fill="#0f0f0f" rx="20"/>
  <text x="140" y="160" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="18" font-weight="700">La-Fierce</text>
  
  <!-- Theme button -->
  <rect x="90" y="180" width="100" height="30" fill="none" stroke="#ff3700" stroke-width="1" rx="15"/>
  <text x="140" y="200" text-anchor="middle" fill="#a0a0a0" font-family="Inter" font-size="12">🌙 Dark Mode</text>
  
  <!-- Navigation items -->
  <g fill="#a0a0a0" font-family="Inter" font-size="14">
    <text x="24" y="250">🏠 Introduction</text>
    <text x="24" y="280">🎯 Purpose</text>
    <text x="24" y="310">🏆 Success Stories</text>
    <text x="24" y="340">📱 Software / Application</text>
    <text x="24" y="370">🛡️ Transparency</text>
    <text x="24" y="400">🎮 Gamification</text>
    <text x="24" y="430">⬇️ Download</text>
    <text x="24" y="460">💡 Mistakes-to-Success</text>
  </g>
  
  <!-- Active indicator -->
  <rect x="0" y="360" width="4" height="20" fill="#ff3700"/>
  
  <!-- Main content area -->
  <rect x="280" y="0" width="520" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="540" y="40" text-anchor="middle" fill="#333333" font-family="Inter" font-size="32" font-weight="700">Transparency</text>
  
  <!-- Transparency Card 1 -->
  <rect x="300" y="80" width="480" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="20"/>
  <circle cx="340" cy="140" r="25" fill="#ff3700"/>
  <text x="340" y="145" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="16">👁️</text>
  <text x="380" y="110" fill="#333333" font-family="Inter" font-size="16" font-weight="600">Open Source</text>
  <text x="380" y="130" fill="#6c757d" font-family="Inter" font-size="12">Contributing to the community</text>
  <text x="380" y="150" fill="#333333" font-family="Inter" font-size="11">We believe in transparency and open collaboration.</text>
  <text x="380" y="170" fill="#333333" font-family="Inter" font-size="11">Our code and practices are available for review.</text>
  <text x="380" y="190" fill="#ff3700" font-family="Inter" font-size="10" font-weight="600">📂 GitHub Repository</text>
  
  <!-- Transparency Card 2 -->
  <rect x="300" y="220" width="480" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="20"/>
  <circle cx="340" cy="280" r="25" fill="#ff3700"/>
  <text x="340" y="285" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="16">📋</text>
  <text x="380" y="250" fill="#333333" font-family="Inter" font-size="16" font-weight="600">Clear Policies</text>
  <text x="380" y="270" fill="#6c757d" font-family="Inter" font-size="12">Easy-to-understand terms and conditions</text>
  <text x="380" y="290" fill="#333333" font-family="Inter" font-size="11">No hidden fees or complicated jargon.</text>
  <text x="380" y="310" fill="#333333" font-family="Inter" font-size="11">Everything is written in plain language.</text>
  <text x="380" y="330" fill="#ff3700" font-family="Inter" font-size="10" font-weight="600">📖 Terms of Service</text>
  
  <!-- Transparency Card 3 -->
  <rect x="300" y="360" width="480" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="20"/>
  <circle cx="340" cy="420" r="25" fill="#ff3700"/>
  <text x="340" y="425" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="16">👥</text>
  <text x="380" y="390" fill="#333333" font-family="Inter" font-size="16" font-weight="600">Community Input</text>
  <text x="380" y="410" fill="#6c757d" font-family="Inter" font-size="12">User-driven development</text>
  <text x="380" y="430" fill="#333333" font-family="Inter" font-size="11">Your feedback shapes our roadmap.</text>
  <text x="380" y="450" fill="#333333" font-family="Inter" font-size="11">We actively listen and implement suggestions.</text>
  <text x="380" y="470" fill="#ff3700" font-family="Inter" font-size="10" font-weight="600">💬 Feedback Portal</text>
  
  <!-- Transparency Card 4 -->
  <rect x="300" y="500" width="480" height="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="20"/>
  <circle cx="340" cy="540" r="25" fill="#ff3700"/>
  <text x="340" y="545" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="16">📢</text>
  <text x="380" y="520" fill="#333333" font-family="Inter" font-size="16" font-weight="600">Regular Updates</text>
  <text x="380" y="540" fill="#6c757d" font-family="Inter" font-size="12">Transparent communication about changes</text>
  <text x="380" y="560" fill="#333333" font-family="Inter" font-size="11">Weekly progress reports and roadmap updates</text>
</svg>
