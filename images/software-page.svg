<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="600" fill="#161616"/>
  <rect x="0" y="0" width="280" height="600" fill="none" stroke="#2d2d2d" stroke-width="1"/>
  
  <!-- Logo area -->
  <rect x="85" y="28" width="110" height="110" fill="#0f0f0f" rx="20"/>
  <text x="140" y="160" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="18" font-weight="700">La-Fierce</text>
  
  <!-- Theme button -->
  <rect x="90" y="180" width="100" height="30" fill="none" stroke="#ff3700" stroke-width="1" rx="15"/>
  <text x="140" y="200" text-anchor="middle" fill="#a0a0a0" font-family="Inter" font-size="12">🌙 Dark Mode</text>
  
  <!-- Navigation items -->
  <g fill="#a0a0a0" font-family="Inter" font-size="14">
    <text x="24" y="250">🏠 Introduction</text>
    <text x="24" y="280">🎯 Purpose</text>
    <text x="24" y="310">🏆 Success Stories</text>
    <text x="24" y="340">📱 Software / Application</text>
    <text x="24" y="370">🛡️ Transparency</text>
    <text x="24" y="400">🎮 Gamification</text>
    <text x="24" y="430">⬇️ Download</text>
    <text x="24" y="460">💡 Mistakes-to-Success</text>
  </g>
  
  <!-- Active indicator -->
  <rect x="0" y="330" width="4" height="20" fill="#ff3700"/>
  
  <!-- Main content area -->
  <rect x="280" y="0" width="520" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="540" y="40" text-anchor="middle" fill="#333333" font-family="Inter" font-size="32" font-weight="700">How It Works</text>
  
  <!-- Video container -->
  <rect x="300" y="80" width="480" height="270" fill="#000000" rx="30"/>
  <rect x="300" y="80" width="480" height="270" fill="none" stroke="#ffffff" stroke-width="1" rx="30" opacity="0.08"/>
  <text x="540" y="220" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="24">▶️</text>
  <text x="540" y="250" text-anchor="middle" fill="#ffffff" font-family="Inter" font-size="12">Demo Video</text>
  
  <!-- App screenshots section -->
  <text x="540" y="380" text-anchor="middle" fill="#333333" font-family="Inter" font-size="18" font-weight="600">Available on All Platforms</text>
  
  <!-- Phone mockups -->
  <rect x="320" y="400" width="80" height="160" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="15"/>
  <rect x="325" y="405" width="70" height="150" fill="#161616" rx="10"/>
  <rect x="330" y="410" width="60" height="120" fill="#f8f9fa" rx="5"/>
  <text x="360" y="475" text-anchor="middle" fill="#333333" font-family="Inter" font-size="8">Mobile App</text>
  
  <rect x="420" y="400" width="80" height="160" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="15"/>
  <rect x="425" y="405" width="70" height="150" fill="#161616" rx="10"/>
  <rect x="430" y="410" width="60" height="120" fill="#f8f9fa" rx="5"/>
  <text x="460" y="475" text-anchor="middle" fill="#333333" font-family="Inter" font-size="8">Tablet App</text>
  
  <rect x="520" y="400" width="80" height="160" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="15"/>
  <rect x="525" y="405" width="70" height="150" fill="#161616" rx="10"/>
  <rect x="530" y="410" width="60" height="120" fill="#f8f9fa" rx="5"/>
  <text x="560" y="475" text-anchor="middle" fill="#333333" font-family="Inter" font-size="8">Desktop App</text>
  
  <!-- Feature badges -->
  <rect x="300" y="570" width="480" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="10"/>
  <g fill="#198754" font-family="Inter" font-size="10" font-weight="600">
    <text x="320" y="583">✓ Cross-Platform</text>
    <text x="450" y="583">✓ Real-Time Sync</text>
    <text x="580" y="583">✓ Secure</text>
  </g>
</svg>
